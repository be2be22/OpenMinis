name: Android unit tests (Antigravity)

on:
  push:
    branches: [feat/android-antigravity-native-oauth]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile and run Antigravity unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --tests "com.openminis.app.provider.antigravity.*" --no-daemon --stacktrace > gradle-antigravity.log 2>&1
          status=$?
          tail -n 300 gradle-antigravity.log
          exit $status

      - name: Surface compiler and test errors as annotations
        if: failure()
        run: |
          grep -E '^e: |FAILED|AssertionError|Exception' gradle-antigravity.log | head -n 60 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Gradle::$safe"
          done

      - name: Upload test reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-test-reports
          path: |
            src/android/app/build/reports/tests/
            src/android/gradle-antigravity.log
          if-no-files-found: ignore
