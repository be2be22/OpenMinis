name: Android unit tests (Antigravity)

on:
  push:
    branches: [feat/android-antigravity-native-oauth]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Antigravity unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.openminis.app.provider.antigravity.*" --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-test-reports
          path: src/android/app/build/reports/tests/
          if-no-files-found: ignore
