name: Android unit tests and debug APK (Antigravity)

on:
  push:
    branches: [feat/android-antigravity-native-oauth]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
      - name: Install Android NDK r28
        run: |
          set -euo pipefail
          ndk_root="$ANDROID_HOME/ndk"
          mkdir -p "$ndk_root"
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q /tmp/ndk.zip -d "$ndk_root"
          mv "$ndk_root/android-ndk-r28" "$ndk_root/28.0.0"
          echo "ANDROID_NDK_HOME=$ndk_root/28.0.0" >> "$GITHUB_ENV"
      - name: Build rclone.aar with the repository script
        run: |
          set -euo pipefail
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - name: Make gradlew executable
        working-directory: src/android
        run: chmod +x gradlew
      - name: Compile and run Antigravity unit tests
        working-directory: src/android
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --tests "com.openminis.app.provider.antigravity.*" --no-daemon --stacktrace > gradle-antigravity.log 2>&1
          status=$?
          tail -n 300 gradle-antigravity.log
          exit $status
      - name: Surface compiler and test errors as annotations
        if: failure()
        working-directory: src/android
        run: |
          grep -E '^e: |FAILED|AssertionError|Exception' gradle-antigravity.log | head -n 60 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Gradle::$safe"
          done
      - name: Upload test reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-test-reports
          path: |
            src/android/app/build/reports/tests/
            src/android/gradle-antigravity.log
          if-no-files-found: ignore

  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the PRoot fork needed by the app build
        run: git submodule update --init --depth 1 deps/proot
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
      - name: Install Android NDK r28
        run: |
          set -euo pipefail
          ndk_root="$ANDROID_HOME/ndk"
          mkdir -p "$ndk_root"
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q /tmp/ndk.zip -d "$ndk_root"
          mv "$ndk_root/android-ndk-r28" "$ndk_root/28.0.0"
          echo "ANDROID_NDK_HOME=$ndk_root/28.0.0" >> "$GITHUB_ENV"
      - name: Build rclone.aar
        run: |
          set -euo pipefail
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - name: Build PRoot binaries and Alpine rootfs
        run: |
          set -euo pipefail
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
      - name: Assemble the debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > gradle-apk.log 2>&1
          status=$?
          tail -n 200 gradle-apk.log
          exit $status
      - name: Verify the APK exists
        working-directory: src/android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$apk"
          ls -la "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-antigravity-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: src/android/gradle-apk.log
          if-no-files-found: ignore
